[package]
name = "temporal-integrity-commission"
version = "0.1.0"
edition = "2021"

[dependencies]
async-stream = "0.3"
bytes = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
console = "0.15"
futures = "0.3"
hex = "0.4"
indicatif = "0.17"
reqwest = { version = "0.12", features = ["stream"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "signal"] }
url = "2"
